[project]
name = "foodapp"
version = "0.1.0"
description = "obj visu data"
authors = [
    {name = "Lili Terrier",email = "lili.terrier@tuta.io"}
]
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "jupyter (>=1.1.1,<2.0.0)",
    "numpy (>=2.3.0,<3.0.0)",
    "tqdm (>=4.67.1,<5.0.0)",
    "graphviz (>=0.21,<0.22)",
    "pyvis (>=0.3.2,<0.4.0)",
    "scikit-learn (>=1.7.1,<2.0.0)",
    "pyarrow (>=21.0.0,<22.0.0)",
    "pandas (>=2.3.1,<3.0.0)",
    "matplotlib (>=3.10.5,<4.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "polars (>=1.32.3,<2.0.0)",
    "plotly (>=6.3.0,<7.0.0)",
    "lightgbm (>=4.6.0,<5.0.0)",
    "optuna (>=4.5.0,<5.0.0)",
    "transformers (>=4.56.1,<5.0.0)",
    "torch (>=2.8.0,<3.0.0)",
    "pycountry (>=24.6.1,<25.0.0)",
    "folium (>=0.20.0,<0.21.0)",
    "shap (>=0.49.1,<0.50.0)"
]

[tool.poetry]

[tool.poetry.group.dev.dependencies]
polars = "^1.31.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
